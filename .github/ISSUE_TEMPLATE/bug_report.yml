name: Bug Report
description: Report something that is not working correctly
title: '[BUG] '
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Run `...`
        2. Then `...`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Where did this happen?
      description: Pick the environment in which the bug occurred.
      options:
        - Local dev (`npm run dev`)
        - Vercel deployment
        - GitHub Action / CI
        - Other
    validations:
      required: true

  - type: dropdown
    id: channel
    attributes:
      label: Channel or surface involved
      description: Which part of the agent touched the bug?
      options:
        - `agent/channels/eve.ts`
        - `agent/channels/github.ts`
        - `agent/extensions/github.ts`
        - Agent core (`agent/agent.ts`)
        - N/A
      multiple: true
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or stack trace
      description: |
        Paste relevant logs or a stack trace. **Do not include tokens,
        secrets, or API keys** — redact before pasting.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Environment details
      description: Node version, OS, `eve` version if relevant.
      placeholder: |
        - Node: 24.x
        - npm: x.x.x
        - OS: macOS / Linux / Windows
    validations:
      required: false

  - type: checkboxes
    id: metadata
    attributes:
      label: Metadata
      options:
        - label: I have searched existing issues for similar reports
        - label: I can reproduce this consistently
